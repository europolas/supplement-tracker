# Insert only inside the existing perimove.com HTTPS server block.
# Both services bind loopback; this proxy is the public TLS boundary.
location = /supplement-tracker { return 308 /supplement-tracker/; }
location ^~ /supplement-tracker/ {
    proxy_pass http://127.0.0.1:8095/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /supplement-api/ {
    client_max_body_size 4500k;
    proxy_pass http://127.0.0.1:8094/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 110s;
    proxy_send_timeout 110s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
